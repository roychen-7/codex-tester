name: Check
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  git-flow:
    name: git-flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR branch flow
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: sh scripts/check-git-flow.sh pr "$SOURCE_BRANCH" "$TARGET_BRANCH"
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sub2api_test
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fixture_admin -d sub2api_test"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-only
          MYSQL_DATABASE: agent_test
          MYSQL_USER: agent
          MYSQL_PASSWORD: agent-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      TEST_MYSQL_DSN: agent:agent-test-only@tcp(127.0.0.1:3306)/agent_test
      E2E_MYSQL_PORT: '3306'
      E2E_POSTGRES_PORT: '5432'
      TEST_POSTGRES_DSN: postgres://analyst:analyst-test-only@127.0.0.1:5432/sub2api_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Initialize synthetic PostgreSQL fixture
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U fixture_admin -d sub2api_test < infra/postgres-test/001-fixture.sql
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: go -C apps/api mod download
      - run: make check
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: make check-e2e
