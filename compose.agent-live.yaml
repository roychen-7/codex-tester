# Local Agent -> live read-only PostgreSQL. No database initialization or migration.
services:
  query-live:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    init: true
    environment:
      APP_ENV: "${APP_ENV:-local}"
      GOWORK: "off"
      QUERY_DATA_SOURCE: live
      QUERY_POSTGRES_DSN: "${QUERY_POSTGRES_DSN:-}"
      QUERY_POSTGRES_HOST: "${QUERY_POSTGRES_HOST:-}"
      QUERY_POSTGRES_PORT: "${QUERY_POSTGRES_PORT:-}"
      QUERY_POSTGRES_DATABASE: "${QUERY_POSTGRES_DATABASE:-}"
      QUERY_POSTGRES_USER: "${QUERY_POSTGRES_USER:-}"
      QUERY_POSTGRES_PASSWORD: "${QUERY_POSTGRES_PASSWORD:-}"
      QUERY_POSTGRES_SSLMODE: "${QUERY_POSTGRES_SSLMODE:-}"
      QUERY_MCP_TOKEN: "${QUERY_MCP_TOKEN:?请配置至少32字节的 QUERY_MCP_TOKEN}"
      QUERY_MCP_ADDRESS: 0.0.0.0:3001
    command: ["go", "run", "./cmd/query-mcp"]
    volumes:
      - ./apps/api:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    healthcheck:
      # An unauthenticated MCP GET must return 401, proving the service is ready.
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/mcp)\" = 401"]
      interval: 3s
      timeout: 3s
      start_period: 120s
      retries: 10
  api:
    environment:
      AGENT_MODE: conversation
      AGENT_DATA_SOURCE: live
      AGENT_MCP_URL: http://query-live:3001/mcp
      AGENT_MCP_TOKEN: "${QUERY_MCP_TOKEN:?请配置 QUERY_MCP_TOKEN}"
    depends_on:
      query-live:
        condition: service_healthy
