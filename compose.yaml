name: codex-tester

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请先执行 make init-env}"
      MYSQL_DATABASE: agent
      MYSQL_USER: agent
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?请先执行 make init-env}"
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - agent-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u agent -D agent -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 30

  mysql-test:
    image: mysql:8.0
    profiles: [test]
    environment:
      MYSQL_ROOT_PASSWORD: test-root-only
      MYSQL_DATABASE: agent_test
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent-test-only
      TZ: UTC
    ports:
      - "127.0.0.1:13307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=agent-test-only mysql -h 127.0.0.1 -u agent -D agent_test -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 30

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    init: true
    environment:
      APP_ENV: "${APP_ENV-local}"
      LOG_LEVEL: "${LOG_LEVEL-}"
      HOST: 0.0.0.0
      PORT: "3000"
      GOWORK: "off"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: agent
      MYSQL_USER: agent
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_TLS: "false"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OPENAI_TIMEOUT_SECONDS: "${OPENAI_TIMEOUT_SECONDS:-120}"
    command: ["sh", "-c", "go run ./cmd/manage migrate && air -c .air.toml"]
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-13000}:3000"
    volumes:
      - ./apps/api:/app
      - api-bin:/app/bin
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 2s
      start_period: 120s
      retries: 10
    stop_grace_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    init: true
    environment:
      API_TARGET: http://api:3000
      CI: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - web-modules:/app/node_modules
      - web-store:/pnpm/store
      - web-dist:/app/dist
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 10

volumes:
  agent-mysql:
  api-bin:
  go-mod:
  go-build:
  web-modules:
  web-store:
  web-dist:
